{{- /* Inline so it can be emitted only on pages that actually render the filter.
       Deleting the [hidden] attributes up front is what makes the control
       opt-in: with JS off nothing is hidden and every entry stays readable. */ -}}
<script>
(function () {
  var root = document.querySelector('[data-tag-filter]');
  var list = document.querySelector('[data-feed-entries]');
  if (!root || !list) return;

  var chips = [].slice.call(root.querySelectorAll('.tag-chip'));
  var entries = [].slice.call(list.querySelectorAll('.feed-entry'));
  var count = root.querySelector('[data-filter-count]');

  // Mark JS as available only now, so no-JS visitors never see hidden entries.
  entries.forEach(function (entry) { entry.hidden = false; });

  function apply(tag) {
    var shown = 0;
    entries.forEach(function (entry) {
      var tags = (entry.getAttribute('data-tags') || '').split(/\s+/);
      var match = !tag || tags.indexOf(tag) !== -1;
      entry.hidden = !match;
      if (match) shown++;
    });
    chips.forEach(function (chip) {
      chip.classList.toggle('is-active', chip.getAttribute('data-tag') === tag);
    });
    if (count) {
      count.textContent = tag
        ? shown + (shown === 1 ? ' post tagged ' : ' posts tagged ') + tag
        : '';
    }
  }

  root.addEventListener('click', function (event) {
    var chip = event.target.closest('.tag-chip');
    if (!chip) return;
    apply(chip.getAttribute('data-tag'));
  });

  apply('');
})();
</script>
